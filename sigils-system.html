<!-- ============================================================
     JYOGI SIGIL SYSTEM — v1
     Drop-in decorative sigil layer (protection + lucky symbols)
     with full per-sigil control: zone, position, opacity, animation.

     WHERE TO PASTE:
     - CSS block  -> into the <style> section of index_master.html
     - HTML block -> right after <body> opens (or right before
                     the sections you want to anchor to — see notes)
     - JS block   -> just before </body>, after other scripts

     FILES YOU NEED:
     - Export each sigil from Canva as SVG
     - Save them as e.g. /assets/sigils/protection-1.svg,
       /assets/sigils/lucky-1.svg, etc.
     - Upload to your repo alongside index_master.html
     ============================================================ -->


<!-- ============================================================
     1. CSS  (paste into <style> in <head>)
     ============================================================ -->
<style>
  /* --- Sigil layer containers --- */
  .sigil-layer {
    position: relative; /* zones that need local anchoring rely on this on their parent section */
  }

  .sigil-layer--fixed-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;         /* keep just above body background, below content (content should have z-index:1+) */
    overflow: hidden;
  }

  /* Individual sigil element */
  .sigil {
    position: absolute;
    pointer-events: none;
    user-select: none;
    will-change: transform, opacity;
    transition: opacity 1.2s ease;
  }

  .sigil img,
  .sigil svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Optional gold tint for sigils that are plain black/line art SVGs.
     Only works cleanly on monochrome SVGs. Remove if your Canva
     export is already colored the way you want. */
  .sigil--gold-tint img {
    filter: invert(72%) sepia(45%) saturate(400%) hue-rotate(2deg) brightness(95%);
  }

  /* --- Animation variants (opt-in via config, class applied by JS) --- */
  .sigil--rotate-slow {
    animation: sigilRotate 60s linear infinite;
  }
  .sigil--rotate-fast {
    animation: sigilRotate 20s linear infinite;
  }
  @keyframes sigilRotate {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .sigil--pulse {
    animation: sigilPulse 6s ease-in-out infinite;
  }
  @keyframes sigilPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }

  .sigil--float {
    animation: sigilFloat 8s ease-in-out infinite;
  }
  @keyframes sigilFloat {
    0%, 100% { transform: translateY(0px); }
    50%      { transform: translateY(-14px); }
  }

  /* --- Fade-in-on-scroll: JS toggles .is-visible, this handles the transition --- */
  .sigil--fade-scroll {
    opacity: 0 !important;
  }
  .sigil--fade-scroll.is-visible {
    opacity: var(--sigil-target-opacity, 0.08) !important;
  }

  /* --- Mobile: dial everything down a notch unless overridden per-sigil --- */
  @media (max-width: 768px) {
    .sigil {
      opacity: calc(var(--sigil-target-opacity, 0.08) * 0.6);
    }
    .sigil--hide-mobile {
      display: none !important;
    }
  }
</style>


<!-- ============================================================
     2. HTML ANCHOR POINTS
     ============================================================

     a) FULL-PAGE BACKGROUND — paste once, right after <body>:
-->
<div class="sigil-layer sigil-layer--fixed-bg" id="sigilLayerFullBg"></div>

<!--
     b) SECTION ZONES — your hero / services / footer sections need
        position:relative and a small anchor div inside them, e.g.:

        <section class="hero" style="position:relative;">
          <div class="sigil-layer" id="sigilLayerHero"></div>
          ... existing hero content ...
        </section>

        <section class="services" style="position:relative;">
          <div class="sigil-layer" id="sigilLayerServices"></div>
          ... existing services content ...
        </section>

        <footer style="position:relative;">
          <div class="sigil-layer" id="sigilLayerFooter"></div>
          ... existing footer content ...
        </footer>

     c) CORNERS — these are viewport-fixed, paste once anywhere:
-->
<div class="sigil-layer sigil-layer--fixed-bg" id="sigilLayerCorners" style="z-index:0;"></div>


<!-- ============================================================
     3. JS CONTROLLER  (paste before </body>)
     ============================================================ -->
<script>
(function () {
  /* ----------------------------------------------------------
     CONFIG — this is your control panel.
     Add / remove / edit entries here. Nothing else needs to change.

     Fields:
       id            unique string
       type          'protection' | 'lucky'  (just for your own labeling)
       src           path to the SVG file
       zone          'full-bg' | 'hero' | 'services' | 'footer' |
                     'corner-tl' | 'corner-tr' | 'corner-bl' | 'corner-br'
       top/left/right/bottom   CSS position values, e.g. '8%', '40px'
                     (use the two that make sense for the zone/corner)
       size          px, width & height (square)
       opacity       0–1, the target/resting opacity
       goldTint      true/false — apply CSS gold filter (monochrome SVGs only)
       animation     'none' | 'rotate-slow' | 'rotate-fast' | 'pulse' | 'float'
       fadeInOnScroll  true/false — starts at 0 opacity, fades to target
                     opacity when scrolled into view
       hideOnMobile  true/false
       zIndex        integer, default 0
     ---------------------------------------------------------- */
  const SIGIL_CONFIG = [
    {
      id: 'protection-hero-1',
      type: 'protection',
      src: 'assets/sigils/protection-1.svg',
      zone: 'hero',
      top: '8%', right: '4%',
      size: 260,
      opacity: 0.06,
      goldTint: true,
      animation: 'none',
      fadeInOnScroll: false,
      hideOnMobile: true
    },
    {
      id: 'lucky-hero-1',
      type: 'lucky',
      src: 'assets/sigils/lucky-1.svg',
      zone: 'hero',
      bottom: '6%', left: '3%',
      size: 200,
      opacity: 0.08,
      goldTint: true,
      animation: 'float',
      fadeInOnScroll: false,
      hideOnMobile: true
    },
    {
      id: 'protection-services-1',
      type: 'protection',
      src: 'assets/sigils/protection-2.svg',
      zone: 'services',
      top: '10%', left: '2%',
      size: 180,
      opacity: 0.05,
      goldTint: true,
      animation: 'rotate-slow',
      fadeInOnScroll: true,
      hideOnMobile: true
    },
    {
      id: 'lucky-footer-1',
      type: 'lucky',
      src: 'assets/sigils/lucky-2.svg',
      zone: 'footer',
      bottom: '10%', right: '5%',
      size: 220,
      opacity: 0.1,
      goldTint: true,
      animation: 'pulse',
      fadeInOnScroll: true,
      hideOnMobile: false
    },
    {
      id: 'protection-corner-tl',
      type: 'protection',
      src: 'assets/sigils/protection-1.svg',
      zone: 'corner-tl',
      top: '2%', left: '1%',
      size: 120,
      opacity: 0.04,
      goldTint: true,
      animation: 'none',
      fadeInOnScroll: false,
      hideOnMobile: true
    },
    {
      id: 'lucky-corner-br',
      type: 'lucky',
      src: 'assets/sigils/lucky-1.svg',
      zone: 'corner-br',
      bottom: '2%', right: '1%',
      size: 130,
      opacity: 0.05,
      goldTint: true,
      animation: 'none',
      fadeInOnScroll: false,
      hideOnMobile: true
    }
    // Add more entries here any time — copy a block above, change id/src/zone/position.
  ];

  /* ----------------------------------------------------------
     ZONE -> CONTAINER map
     'full-bg' and the four corners share the fixed background
     layers; hero/services/footer resolve to the anchor divs you
     placed inside those sections.
     ---------------------------------------------------------- */
  function resolveContainer(zone) {
    switch (zone) {
      case 'full-bg':
        return document.getElementById('sigilLayerFullBg');
      case 'hero':
        return document.getElementById('sigilLayerHero');
      case 'services':
        return document.getElementById('sigilLayerServices');
      case 'footer':
        return document.getElementById('sigilLayerFooter');
      case 'corner-tl':
      case 'corner-tr':
      case 'corner-bl':
      case 'corner-br':
        return document.getElementById('sigilLayerCorners');
      default:
        return null;
    }
  }

  const io = ('IntersectionObserver' in window)
    ? new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15 })
    : null;

  function renderSigil(cfg) {
    const container = resolveContainer(cfg.zone);
    if (!container) {
      console.warn('[Sigils] No container found for zone:', cfg.zone, '— skipping', cfg.id);
      return;
    }

    const el = document.createElement('div');
    el.className = 'sigil';
    el.dataset.sigilId = cfg.id;
    el.dataset.sigilType = cfg.type || '';

    if (cfg.goldTint) el.classList.add('sigil--gold-tint');
    if (cfg.animation && cfg.animation !== 'none') {
      el.classList.add('sigil--' + cfg.animation);
    }
    if (cfg.hideOnMobile) el.classList.add('sigil--hide-mobile');

    el.style.width = cfg.size + 'px';
    el.style.height = cfg.size + 'px';
    if (cfg.top !== undefined) el.style.top = cfg.top;
    if (cfg.bottom !== undefined) el.style.bottom = cfg.bottom;
    if (cfg.left !== undefined) el.style.left = cfg.left;
    if (cfg.right !== undefined) el.style.right = cfg.right;
    el.style.zIndex = cfg.zIndex != null ? cfg.zIndex : 0;
    el.style.setProperty('--sigil-target-opacity', cfg.opacity != null ? cfg.opacity : 0.08);

    if (cfg.fadeInOnScroll) {
      el.classList.add('sigil--fade-scroll');
    } else {
      el.style.opacity = cfg.opacity != null ? cfg.opacity : 0.08;
    }

    const img = document.createElement('img');
    img.src = cfg.src;
    img.alt = ''; // decorative — empty alt is correct for a11y
    img.loading = 'lazy';
    el.appendChild(img);

    container.appendChild(el);

    if (cfg.fadeInOnScroll && io) io.observe(el);
  }

  function init() {
    SIGIL_CONFIG.forEach(renderSigil);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  /* ----------------------------------------------------------
     Optional: expose a small runtime API for quick tweaks
     from the browser console without redeploying, e.g.:
       SigilController.hide('lucky-footer-1')
       SigilController.setOpacity('protection-hero-1', 0.15)
     ---------------------------------------------------------- */
  window.SigilController = {
    hide(id) {
      const el = document.querySelector('[data-sigil-id="' + id + '"]');
      if (el) el.style.display = 'none';
    },
    show(id) {
      const el = document.querySelector('[data-sigil-id="' + id + '"]');
      if (el) el.style.display = '';
    },
    setOpacity(id, value) {
      const el = document.querySelector('[data-sigil-id="' + id + '"]');
      if (el) {
        el.style.setProperty('--sigil-target-opacity', value);
        if (!el.classList.contains('sigil--fade-scroll')) {
          el.style.opacity = value;
        }
      }
    },
    list() {
      return SIGIL_CONFIG.map(c => c.id);
    }
  };
})();
</script>

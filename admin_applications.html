<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Applications — Jyogi Admin</title>
<style>
  :root{
    --bg:#03010a; --bg2:#0a0220; --gold:#d4af37; --gold-soft:#e8c977;
    --ink:#f5efe0; --muted:#c4a97a; --dim:rgba(245,239,224,0.4);
    --border:rgba(212,175,55,0.18); --panel:#120a26;
    --ok:#7fbf8f; --warn:#e0977f; --new:#9a8fd6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;line-height:1.6;min-height:100vh}
  body{background-image:radial-gradient(ellipse at top, rgba(91,72,168,0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at bottom, rgba(212,175,55,0.04) 0%, transparent 50%);
       background-attachment:fixed}
  .wrap{max-width:920px;margin:0 auto;padding:32px 20px 80px}
  .hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px;flex-wrap:wrap}
  .hdr-l{display:flex;align-items:center;gap:12px}
  .hdr-logo{font-family:Georgia,serif;font-size:22px;color:var(--gold);letter-spacing:.04em}
  .hdr-badge{background:rgba(212,175,55,.1);border:1px solid var(--border);color:var(--gold);
    font-size:10px;padding:4px 10px;border-radius:10px;letter-spacing:.15em;text-transform:uppercase}
  .btn{font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--panel);
    border:1px solid var(--border);border-radius:8px;padding:8px 16px;cursor:pointer}
  .btn:hover{border-color:var(--gold)}

  /* ── login ── */
  .login-box{max-width:340px;margin:80px auto;background:var(--panel);border:1px solid var(--border);
    border-radius:14px;padding:32px}
  .login-box h1{font-size:18px;margin:0 0 4px;color:var(--gold-soft)}
  .login-box p{font-size:13px;color:var(--dim);margin:0 0 20px}
  .login-box label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
  .login-box input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;
    color:var(--ink);padding:10px 12px;font-size:14px;font-family:inherit}
  .login-box input:focus{outline:none;border-color:var(--gold)}
  .login-box button{width:100%;margin-top:20px;background:linear-gradient(135deg,var(--gold),#a67c2e);
    color:#1a1206;border:none;border-radius:8px;padding:11px;font-weight:700;font-size:14px;cursor:pointer}
  .login-err{font-size:12px;color:var(--warn);margin-top:10px;display:none}

  /* ── stats row ── */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:24px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .stat b{display:block;font-size:22px;color:var(--gold-soft);font-family:Georgia,serif}
  .stat span{font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}

  /* ── filter tabs ── */
  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
  .tab{font-size:12px;font-weight:600;color:var(--muted);background:transparent;border:1px solid var(--border);
    border-radius:100px;padding:6px 14px;cursor:pointer}
  .tab.active{color:#1a1206;background:var(--gold);border-color:var(--gold)}

  /* ── application cards ── */
  .app-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:12px}
  .app-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .app-name{font-size:16px;font-weight:700;color:var(--ink)}
  .app-topic{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
  .app-time{font-size:11px;color:var(--dim);white-space:nowrap}
  .app-field{margin-top:10px}
  .app-field-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
  .app-field-body{font-size:13.5px;color:var(--ink);line-height:1.55}
  .app-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;
    padding-top:14px;border-top:1px solid var(--border);flex-wrap:wrap}
  .status-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;text-transform:uppercase;letter-spacing:.05em}
  .status-new{background:rgba(154,143,214,.15);color:var(--new)}
  .status-contacted{background:rgba(212,175,55,.15);color:var(--gold-soft)}
  .status-confirmed{background:rgba(127,191,143,.15);color:var(--ok)}
  .status-completed{background:rgba(127,191,143,.1);color:var(--ok);opacity:.7}
  .status-declined{background:rgba(224,151,127,.15);color:var(--warn)}
  select.status-select{background:var(--bg2);border:1px solid var(--border);color:var(--ink);border-radius:6px;
    padding:6px 10px;font-size:12px;font-family:inherit}
  .empty{text-align:center;padding:60px 20px;color:var(--dim);font-size:14px}
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <div class="hdr-l">
      <span class="hdr-logo">Jyogi</span>
      <span class="hdr-badge">Applications</span>
    </div>
    <button class="btn" id="logoutBtn" style="display:none">Log out</button>
  </div>

  <div id="loginScreen" class="login-box">
    <h1>Admin sign-in</h1>
    <p>Sign in to view and manage consultation applications.</p>
    <label for="u">Username</label>
    <input type="text" id="u" autocomplete="username">
    <label for="p">Password</label>
    <input type="password" id="p" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
    <div class="login-err" id="loginErr"></div>
  </div>

  <div id="appScreen" style="display:none">
    <div class="stats" id="statsRow"></div>
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
  </div>

</div>

<script>
// This page is always served BY the API itself (see /admin/applications in
// api.py), so it calls the API same-origin — no SITE_CONFIG, no CORS.
var API_BASE = '';
var STATUSES = ['new','contacted','confirmed','completed','declined'];
var currentFilter = '';
var allApps = [];

function fmtTopic(t){ return t.replace(/&amp;/g,'&'); }
function esc(s){ return (s||'').replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

async function checkSession(){
  try{
    var r = await fetch(API_BASE+'/api/admin/session', {credentials:'include'});
    var d = await r.json();
    if(d && d.authenticated){ showApp(); return; }
  }catch(e){}
  showLogin();
}

function showLogin(){
  document.getElementById('loginScreen').style.display = '';
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('logoutBtn').style.display = 'none';
}

function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = '';
  document.getElementById('logoutBtn').style.display = '';
  loadApplications();
}

document.getElementById('loginBtn').addEventListener('click', async function(){
  var u = document.getElementById('u').value.trim();
  var p = document.getElementById('p').value;
  var err = document.getElementById('loginErr');
  err.style.display = 'none';
  try{
    var r = await fetch(API_BASE+'/api/admin/login', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user:u, password:p})
    });
    if(!r.ok){ throw new Error((await r.json()).detail || 'Login failed'); }
    showApp();
  }catch(e){
    err.textContent = e.message || 'Login failed';
    err.style.display = '';
  }
});

document.getElementById('logoutBtn').addEventListener('click', async function(){
  try{ await fetch(API_BASE+'/api/admin/logout', {method:'POST', credentials:'include'}); }catch(e){}
  showLogin();
});

async function loadApplications(){
  try{
    var r = await fetch(API_BASE+'/api/admin/applications', {credentials:'include'});
    if(r.status === 401){ showLogin(); return; }
    var d = await r.json();
    allApps = d.applications || [];
    renderStats();
    renderTabs();
    renderList();
  }catch(e){
    document.getElementById('list').innerHTML = '<div class="empty">Could not load applications. ' + esc(e.message) + '</div>';
  }
}

function renderStats(){
  var counts = {};
  STATUSES.forEach(function(s){ counts[s] = 0; });
  allApps.forEach(function(a){ counts[a.status] = (counts[a.status]||0) + 1; });
  var html = '<div class="stat"><b>' + allApps.length + '</b><span>Total</span></div>';
  STATUSES.forEach(function(s){
    html += '<div class="stat"><b>' + counts[s] + '</b><span>' + s + '</span></div>';
  });
  document.getElementById('statsRow').innerHTML = html;
}

function renderTabs(){
  var tabs = ['', 'new', 'contacted', 'confirmed', 'completed', 'declined'];
  var html = tabs.map(function(t){
    var label = t === '' ? 'All' : t.charAt(0).toUpperCase()+t.slice(1);
    var active = t === currentFilter ? ' active' : '';
    return '<button class="tab' + active + '" data-status="' + t + '">' + label + '</button>';
  }).join('');
  document.getElementById('tabs').innerHTML = html;
  document.querySelectorAll('.tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      currentFilter = btn.getAttribute('data-status');
      renderTabs();
      renderList();
    });
  });
}

function renderList(){
  var items = currentFilter ? allApps.filter(function(a){ return a.status === currentFilter; }) : allApps;
  var el = document.getElementById('list');
  if(items.length === 0){
    el.innerHTML = '<div class="empty">No applications' + (currentFilter ? ' with status "'+currentFilter+'"' : '') + ' yet.</div>';
    return;
  }
  el.innerHTML = items.map(function(a){
    var opts = STATUSES.map(function(s){
      return '<option value="'+s+'"'+(s===a.status?' selected':'')+'>'+s.charAt(0).toUpperCase()+s.slice(1)+'</option>';
    }).join('');
    return '<div class="app-card">'
      + '<div class="app-top">'
        + '<div><div class="app-name">' + esc(a.name) + '</div><div class="app-topic">' + esc(fmtTopic(a.topic)) + '</div></div>'
        + '<div class="app-time">' + esc(a.created_at) + '</div>'
      + '</div>'
      + '<div class="app-field"><div class="app-field-label">Question</div><div class="app-field-body">' + esc(a.question) + '</div></div>'
      + '<div class="app-field"><div class="app-field-label">Already tried</div><div class="app-field-body">' + esc(a.tried) + '</div></div>'
      + (a.birth_details ? '<div class="app-field"><div class="app-field-label">Birth details</div><div class="app-field-body">' + esc(a.birth_details) + '</div></div>' : '')
      + (a.source ? '<div class="app-field"><div class="app-field-label">Source</div><div class="app-field-body">' + esc(a.source) + '</div></div>' : '')
      + '<div class="app-bottom">'
        + '<span class="status-pill status-' + a.status + '">' + a.status + '</span>'
        + '<select class="status-select" data-id="' + a.id + '">' + opts + '</select>'
      + '</div>'
    + '</div>';
  }).join('');

  el.querySelectorAll('.status-select').forEach(function(sel){
    sel.addEventListener('change', async function(){
      var id = sel.getAttribute('data-id');
      var newStatus = sel.value;
      try{
        await fetch(API_BASE+'/api/admin/applications/'+id, {
          method:'POST', credentials:'include',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({status:newStatus})
        });
        var a = allApps.find(function(x){ return x.id === id; });
        if(a) a.status = newStatus;
        renderStats();
        renderList();
      }catch(e){ alert('Could not update status.'); }
    });
  });
}

checkSession();
</script>
</body>
</html>
